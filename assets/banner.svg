<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="340" style="background: transparent;">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#93c5fd" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.7)" />
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.85)" />
    </linearGradient>

    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .beacon-ring {
        transform-origin: 1080px 70px;
        animation: pulseRing 3s ease-out infinite;
      }
      .beacon-ring-2 {
        transform-origin: 1080px 70px;
        animation: pulseRing 3s ease-out infinite 1.5s;
      }
      .beacon-center {
        animation: heartbeat 1.5s ease-in-out infinite;
        transform-origin: 1080px 70px;
      }
      .flow-dot {
        animation: flowAlong 4s linear infinite;
      }
      .flow-dot-2 {
        animation: flowAlong 4s linear infinite 2s;
      }
      .pill-badge {
        animation: floatPill 6s ease-in-out infinite;
      }
      .pill-badge-2 {
        animation: floatPill 6s ease-in-out infinite 3s;
      }
      @keyframes pulseRing {
        0% { r: 10px; opacity: 0.9; stroke-width: 3px; }
        100% { r: 55px; opacity: 0; stroke-width: 1px; }
      }
      @keyframes heartbeat {
        0%, 100% { transform: scale(1); filter: drop-shadow(0 0 4px #ef4444); }
        50% { transform: scale(1.15); filter: drop-shadow(0 0 14px #ef4444); }
      }
      @keyframes flowAlong {
        0% { stroke-dashoffset: 400; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes floatPill {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-5px); }
      }
    </style>
  </defs>

  <!-- Card Canvas -->
  <rect width="1198" height="338" x="1" y="1" rx="20" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5" />

  <!-- Background Decorative Grid Lines -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="200" y1="0" x2="200" y2="340" />
    <line x1="400" y1="0" x2="400" y2="340" />
    <line x1="600" y1="0" x2="600" y2="340" />
    <line x1="800" y1="0" x2="800" y2="340" />
    <line x1="1000" y1="0" x2="1000" y2="340" />
  </g>

  <!-- Alert Flow Signal Wave Line (Dynamic) -->
  <path d="M 50 280 C 200 280, 250 210, 400 210 C 550 210, 600 290, 750 290 C 900 290, 950 220, 1150 220" 
        fill="none" stroke="#3b82f6" stroke-width="2.5" opacity="0.25" />
  
  <path d="M 50 280 C 200 280, 250 210, 400 210 C 550 210, 600 290, 750 290 C 900 290, 950 220, 1150 220" 
        fill="none" stroke="url(#primaryGlow)" stroke-width="3" stroke-dasharray="25 150" class="flow-dot" opacity="0.85" />

  <path d="M 50 280 C 200 280, 250 210, 400 210 C 550 210, 600 290, 750 290 C 900 290, 950 220, 1150 220" 
        fill="none" stroke="#10b981" stroke-width="2.5" stroke-dasharray="35 180" class="flow-dot-2" opacity="0.7" />

  <!-- Animated Incident Beacon Signal in Background corner -->
  <g opacity="0.8">
    <circle cx="1080" cy="75" r="10" stroke="#ef4444" fill="none" class="beacon-ring" />
    <circle cx="1080" cy="75" r="10" stroke="#f59e0b" fill="none" class="beacon-ring-2" />
    <circle cx="1080" cy="75" r="8" fill="#ef4444" class="beacon-center" />
    <text x="1080" y="105" text-anchor="middle" fill="#fca5a5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" letter-spacing="1">LIVE ESCALATION</text>
  </g>

  <!-- Status / Feature Badges Floating (Back layer) -->
  <g class="pill-badge">
    <rect x="730" y="42" width="170" height="32" rx="16" fill="url(#cardGrad)" stroke="#3b82f6" stroke-width="1.2" />
    <circle cx="748" cy="58" r="4.5" fill="#38bdf8" />
    <text x="760" y="63" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">99.99% Uptime Target</text>
  </g>

  <g class="pill-badge-2">
    <rect x="915" y="42" width="130" height="32" rx="16" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.2" />
    <circle cx="932" cy="58" r="4.5" fill="#10b981" />
    <text x="944" y="63" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Zero Alert Fatigue</text>
  </g>

  <!-- Title & Subtitles (Foreground) -->
  <g transform="translate(65, 0)">
    <!-- Top Pill Category -->
    <rect x="0" y="45" width="235" height="28" rx="14" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="14" y="64" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1.2">🚨 SRE &amp; DEVOPS TOOLKIT</text>

    <!-- Main Heading -->
    <text x="0" y="130" fill="url(#textGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">Awesome Incident Management</text>
    <text x="0" y="180" fill="url(#primaryGlow)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="800" letter-spacing="-0.3">&amp; Alerting Platforms</text>

    <!-- Subtitle -->
    <text x="0" y="222" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400">
      A curated index of enterprise SaaS and open-source self-hosted systems for on-call rotations,
    </text>
    <text x="0" y="246" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400">
      intelligent alert deduplication, automated escalation policies, and incident response workflows.
    </text>

    <!-- Capability Tags in Foreground -->
    <g transform="translate(0, 274)">
      <rect x="0" y="0" width="132" height="26" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="10" y="17" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">⚡ On-Call Scheduling</text>

      <rect x="142" y="0" width="130" height="26" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="152" y="17" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">🔔 Smart Alert Routing</text>

      <rect x="282" y="0" width="116" height="26" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="292" y="17" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">🤖 AIOps &amp; Noise</text>

      <rect x="408" y="0" width="138" height="26" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="418" y="17" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">📊 Status &amp; Post-Mortem</text>
    </g>
  </g>
</svg>
